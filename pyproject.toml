[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "im-pytest"
version = "0.1.33"
description = "Run the Instructing Machines project tests three ways: a friendly hidden runner (check() / %%test), the raw pytest CLI, and student-authored tests."
authors = [
    {name = "Kasper Munch", email = "kaspermunch@birc.au.dk"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9,<3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pytest>=7",
    "setuptools>=61.0",
    "ipython",
    "anywidget>=0.11,<0.12",
    "traitlets>=5.0",
]

[project.urls]
Homepage = "https://github.com/munch-group/im-pytest"
Repository = "https://github.com/munch-group/im-pytest"
Documentation = "https://munch-group.org/im-pytest"

[project.scripts]
pytest-check = "im_pytest.cli:main"

# Registered globally so raw `pytest test_<project>.py` (course "mode 2") picks up
# the `sol` fixture, the `requires` marker and the not-defined banner with no
# boilerplate in the test file.
[project.entry-points.pytest11]
im_pytest = "im_pytest.plugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]

# Anchors pytest's rootdir to this repo. Without a [tool.pytest.ini_options]
# table here, a pyproject.toml is *not* a config file as far as pytest is
# concerned, so it keeps walking up the tree looking for one -- and adopts the
# first it meets. On a machine with a stray pyproject.toml carrying this table
# in the home directory, that made rootdir /Users/<name>: confcutdir defaults to
# rootdir, so conftest collection then spanned the whole home directory, and a
# single unresponsive path in it (a cloud-sync folder that stats slowly) failed
# the run with a TimeoutError before a single test was collected. Its addopts
# and testpaths applied to this repo too. Every sibling widget repo carries the
# same two lines for the same reason.
[tool.pytest.ini_options]
testpaths = ["test"]

[tool.pixi.workspace]
channels = ["conda-forge", "munch-group"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.9"
pytest = "*"
ipython = "*"
anywidget = ">=0.11,<0.12"
traitlets = ">=5.0"
quarto = "*"
quartodoc = "*"
nbconvert = "*"
pip = ">=25.2,<26"

[tool.pixi.environments]
default = {solve-group = "default"}

[tool.pixi.tasks.init]
cmd = "python ./scripts/rename.py && gh repo set-default https://github.com/munch-group/$(basename $(git rev-parse --show-toplevel)) && git add src && git add -u"

[tool.pixi.tasks.install-dev]
cmd = "pip install --no-build-isolation --force-reinstall --no-deps ."
description = "Development install"

[tool.pixi.tasks.test]
cmd = "pytest test/"
description = "Run the widget's own test suite"

[tool.pixi.tasks.docs]
cmd = "./scripts/docs-run-notebooks.sh"
description = "Execute documentation notebooks in-place"

[tool.pixi.tasks.api]
cmd = "./scripts/docs-build-render.sh"
description = "Build quartodoc api doc pages"

[tool.pixi.tasks.commit]
cmd = "./scripts/git-commit.sh"

[tool.pixi.tasks.bump]
args = [
  { "arg" = "kind", "default" = "patch" },
  { "arg" = "flag", "default" = "" },
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump'"

[tool.pixi.tasks.release]
args = [
  { "arg" = "kind", "default" = "patch" },
  { "arg" = "flag", "default" = "" },
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump' && git push && ./scripts/github-release.sh"
description = "Bump version and push tag to build/upload conda/pypi packages"
